openapi: 3.1.0
info: { title: Bhandaro API, version: 0.2.0 }
servers: [{ url: /api/v1 }]
security: [{ bearer: [] }]
paths:
  /auth/register:
    post:
      operationId: register
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RegisterRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/Tokens" }, "400": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/Tokens" }, "400": { $ref: "#/components/responses/Error" }, "401": { $ref: "#/components/responses/Error" } }
  /auth/refresh:
    post:
      operationId: refresh
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RefreshRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/Tokens" }, "401": { $ref: "#/components/responses/Error" } }
  /auth/logout:
    post:
      operationId: logout
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RefreshRequest" } } } }
      responses: { "204": { description: Token revoked (idempotent) } }
  /me:
    get:
      operationId: me
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }, "401": { $ref: "#/components/responses/Error" } }
  /users:
    get:
      operationId: listUsers
      description: Requires users.manage
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }, "403": { $ref: "#/components/responses/Error" } }
    post:
      operationId: createUser
      description: Requires users.manage; admins may only create WRITER or READER
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateUserRequest" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }, "400": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /users/{id}:
    put:
      operationId: updateUser
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateUserRequest" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /audit:
    get:
      operationId: listAudit
      description: Requires audit.read. Newest first; pass the last id as `before` for the next page.
      parameters:
        - { name: before, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } } } } } }
  /items:
    get:
      operationId: listItems
      parameters:
        - { name: after, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Item" } } } } } }
    post:
      operationId: createItem
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ItemInput" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }, "409": { $ref: "#/components/responses/Error" } }
  /items/{id}:
    put:
      operationId: updateItem
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ItemInput" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
    delete:
      operationId: deleteItem
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: Deleted (soft) }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /locations:
    get:
      operationId: listLocations
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Location" } } } } } }
    post:
      operationId: createLocation
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LocationInput" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Location" } } } } }
  /locations/{id}:
    put:
      operationId: updateLocation
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LocationInput" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Location" } } } }, "404": { $ref: "#/components/responses/Error" } }
    delete:
      operationId: deleteLocation
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: Deleted (soft) }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /stock:
    get:
      operationId: listStockLevels
      parameters:
        - { name: itemId, in: query, schema: { type: string, format: uuid } }
        - { name: locationId, in: query, schema: { type: string, format: uuid } }
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/StockLevel" } } } } } }
  /stock/movements:
    post:
      operationId: moveStock
      description: Never oversells. Retrying with the same Idempotency-Key and body returns the first result.
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MovementInput" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Movement" } } } }, "400": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
    get:
      operationId: listMovements
      parameters:
        - { name: itemId, in: query, schema: { type: string, format: uuid } }
        - { name: before, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LedgerEntry" } } } } } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Tokens: { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Tokens" } } } }
    Error: { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    # The server never sends sentences: clients translate `code` (with `params`).
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: "Stable machine code, e.g. UNAUTHENTICATED, FORBIDDEN, VALIDATION_FAILED, INVALID_CREDENTIALS, INVALID_TOKEN, TOKEN_REUSED, EMAIL_TAKEN, ROLE_NOT_ALLOWED, SELF_MODIFY_FORBIDDEN, USER_NOT_FOUND, SKU_TAKEN, ITEM_NOT_FOUND, LOCATION_NOT_FOUND, ITEM_HAS_STOCK, LOCATION_HAS_STOCK, INVALID_TIMEZONE, INVALID_DELTA, STOCK_INSUFFICIENT, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_INVALID, IDEMPOTENCY_KEY_REUSED"
        params: { type: object, additionalProperties: true }
    Role: { type: string, enum: [OWNER, ADMIN, WRITER, READER] }
    Reason: { type: string, enum: [RECEIVE, SALE, WASTE, ADJUST] }
    RegisterRequest:
      type: object
      required: [tenantName, email, password]
      properties:
        tenantName: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 128 }
        locale: { type: string, pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})?$" }
    LoginRequest:
      type: object
      required: [email, password]
      properties: { email: { type: string }, password: { type: string } }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties: { refreshToken: { type: string } }
    Tokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties: { accessToken: { type: string }, refreshToken: { type: string }, expiresIn: { type: integer, format: int64 } }
    Me:
      type: object
      required: [id, tenantId, role, permissions]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        permissions: { type: array, items: { type: string } }
    User:
      type: object
      required: [id, email, role, active, locale, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        locale: { type: string }
        createdAt: { type: string, format: date-time }
    CreateUserRequest:
      type: object
      required: [email, password, role]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 128 }
        role: { $ref: "#/components/schemas/Role" }
        locale: { type: string }
    UpdateUserRequest:
      type: object
      required: [role, active]
      properties: { role: { $ref: "#/components/schemas/Role" }, active: { type: boolean } }
    AuditEntry:
      type: object
      required: [id, action, at]
      properties:
        id: { type: integer, format: int64 }
        actorUserId: { type: [string, "null"], format: uuid }
        action: { type: string }
        entity: { type: [string, "null"] }
        entityId: { type: [string, "null"], format: uuid }
        details: { type: [object, "null"], additionalProperties: true }
        at: { type: string, format: date-time }
    ItemInput:
      type: object
      required: [sku, name, unit]
      properties:
        sku: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        unit: { type: string, maxLength: 16 }
        barcode: { type: [string, "null"], maxLength: 64 }
        lowStockThreshold: { type: [number, "null"], minimum: 0 }
    Item:
      type: object
      required: [id, sku, name, unit, version]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        unit: { type: string }
        barcode: { type: [string, "null"] }
        lowStockThreshold: { type: [number, "null"] }
        version: { type: integer }
    LocationInput:
      type: object
      required: [name]
      properties: { name: { type: string, maxLength: 100 }, timezone: { type: [string, "null"], description: "IANA zone, defaults to UTC" } }
    Location:
      type: object
      required: [id, name, timezone, version]
      properties: { id: { type: string, format: uuid }, name: { type: string }, timezone: { type: string }, version: { type: integer } }
    StockLevel:
      type: object
      required: [itemId, locationId, qty]
      properties: { itemId: { type: string, format: uuid }, locationId: { type: string, format: uuid }, qty: { type: number } }
    MovementInput:
      type: object
      required: [itemId, locationId, delta, reason]
      properties:
        itemId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        delta: { type: number, description: "Signed. RECEIVE > 0, SALE and WASTE < 0, ADJUST any non-zero. Up to 3 decimals." }
        reason: { $ref: "#/components/schemas/Reason" }
        note: { type: [string, "null"], maxLength: 200 }
    Movement:
      type: object
      required: [movementId, itemId, locationId, delta, qtyAfter, reason]
      properties:
        movementId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        delta: { type: number }
        qtyAfter: { type: number }
        reason: { $ref: "#/components/schemas/Reason" }
    LedgerEntry:
      type: object
      required: [seq, movementId, itemId, locationId, delta, qtyAfter, reason, actorUserId, createdAt]
      properties:
        seq: { type: integer, format: int64 }
        movementId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        delta: { type: number }
        qtyAfter: { type: number }
        reason: { $ref: "#/components/schemas/Reason" }
        note: { type: [string, "null"] }
        actorUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
